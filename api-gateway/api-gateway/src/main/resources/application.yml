spring:
  application:
    name: api-gateway
#api gateway config


  cloud:
    gateway:
      server:
        webflux:


          routes:
            - id: order-service #uses this id to goto eureka server and find its host and port
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/v1/orders/**
              filters:
                - StripPrefix=2
            - id: inventory-service
              uri: lb://INVENTORY-SERVICE
              predicates:
                - Path=/api/v1/inventory/**
              filters:
                - StripPrefix=2
                - AddRequestHeader=X-Custom-Header, Vidhi

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

